apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: atl8-grant-officer-agent
  namespace: "187574395280"
  labels:
    cloud.googleapis.com/location: us-east1
  annotations:
    serving.knative.dev/creator: qwiklabs-gcp-03-46ba9aeed89b@qwiklabs-gcp-03-46ba9aeed89b.iam.gserviceaccount.com
    serving.knative.dev/lastModifier: qwiklabs-gcp-03-46ba9aeed89b@qwiklabs-gcp-03-46ba9aeed89b.iam.gserviceaccount.com
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: "3"
spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Default
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/vpc-access-connector: projects/qwiklabs-gcp-03-46ba9aeed89b/locations/us-east1/connectors/shared-cloudrun-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      serviceAccountName: 187574395280-compute@developer.gserviceaccount.com
      containers:
      - image: us-east1-docker.pkg.dev/qwiklabs-gcp-03-46ba9aeed89b/cloud-run-source-deploy/atl8-grant-officer-agent:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "qwiklabs-gcp-03-46ba9aeed89b"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-east1"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "TRUE"
        - name: BQ_DATASET
          value: "a4i_econ"
        - name: BQ_LOCATION
          value: "US"
        - name: BQ_GRAPH
          value: "LocalEconomy"
        - name: FRONTEND_PORT
          value: "8080"
        resources:
          limits:
            memory: 1Gi
            cpu: 1000m
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 8080
  traffic:
  - percent: 100
    latestRevision: true
