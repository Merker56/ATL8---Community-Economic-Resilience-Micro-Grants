# ==============================================================================
# Google Cloud Build Configuration for qwiklabs-gcp-03-46ba9aeed89b
# Builds, runs the 13-test E2E suite, pushes to Google Artifact Registry (GAR),
# and deploys to Cloud Run with --min-instances=1.
#
# Run with:
#   gcloud builds submit --config=cloudbuild.yaml --project=qwiklabs-gcp-03-46ba9aeed89b .
# ==============================================================================
substitutions:
  _REGION: us-east1
  _GAR_REPO: atl8
  _SERVICE_NAME: atl8-grant-officer-agent
  _BQ_DATASET: a4i_econ
  _BQ_GRAPH: LocalEconomy

steps:
  # Step 1: Build container image (automatically runs python3 -m unittest tests/test_member2_e2e.py)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push container image to Google Artifact Registry (GAR)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:latest'

  # Step 3: Deploy image from GAR to Cloud Run (--min-instances=1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=2'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--port=8080'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,BQ_DATASET=${_BQ_DATASET},BQ_LOCATION=US,BQ_GRAPH=${_BQ_GRAPH},USE_LIVE_BIGQUERY=true,ENABLE_BIGQUERY_MCP=true'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:latest'
